name: Refresh Finviz cache

on:
  schedule:
    # Every 30 minutes during US market-ish hours is enough for free screens.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scrape Finviz screeners
        run: node scripts/refresh-finviz.mjs
      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/finviz-cache.json
          if git diff --staged --quiet; then
            echo "No cache changes"
          else
            git commit -m "chore: refresh Finviz screener cache"
            git push
          fi
